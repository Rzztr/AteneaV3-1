<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atenea - Botón de Pánico</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    
    <!-- SDK de Supabase necesario para Realtime (Escuchar al operador) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Estilos críticos para el bloqueo */
        #fake-off-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            cursor: none;
            touch-action: none; /* Bloquea gestos táctiles */
        }

        /* Ajuste para que el botón se vea más moderno y grande */
        .panic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            padding: 20px;
        }

        #btn-anon-panic {
            background: radial-gradient(circle, #d73a49 0%, #b11f2d 100%);
            color: #fff;
            font-size: 2.5rem;
            font-weight: 900;
            padding: 4rem;
            border: 8px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(215,58,73,0.4);
            width: 280px;
            height: 280px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }

        #btn-anon-panic:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(215,58,73,0.8);
        }
    </style>
</head>
<body class="dark-theme">

    <!-- Capa de Bloqueo (Modo Sigilo / Pantalla Negra) -->
    <div id="fake-off-overlay"></div>

    <!-- Banner de estado de conexión -->
    <div id="offline-banner" style="display:none; background-color:#d73a49; color:#fff; text-align:center; padding:10px; font-weight:bold; z-index:1000; position:sticky; top:0;">
        MODO OFFLINE: Alertas pendientes de envío.
    </div>

    <div id="app">
        <div class="panic-container">
            <button id="btn-anon-panic">PÁNICO</button>
            
            <button id="btn-stop-panic" style="display:none; background-color:#28a745; color:#fff; font-size:1.2rem; font-weight:700; padding:1rem 2rem; border:none; border-radius:50px; cursor:pointer; margin-top:2rem;">
                DETENER RASTREO
            </button>
        </div>
    </div>

    <!-- Scripts en orden de dependencia -->
    <script src="js/supabase.js"></script>
    <script src="js/db.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✓ Service Worker listo'))
                    .catch(err => console.log('× Error SW:', err));
            });
        }

        // Evitar que el usuario use el botón derecho para intentar salir del bloqueo
        document.addEventListener('contextmenu', event => {
            if (document.getElementById('fake-off-overlay').style.display === 'block') {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
